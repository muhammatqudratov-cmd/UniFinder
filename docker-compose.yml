

services:
  unifinder-api:
    container_name: unifinder-api
    restart: always
    image: node:20.10.0
    ports:
      - 4000:3004
    volumes:
      - ./:/usr/src/unifinder
    working_dir: /usr/src/unifinder

    networks:
      - monorepo-network

    # for production
    command: bash -c "npm install && npm run build && npm run start:prod"

  unifinder-batch:
    container_name: unifinder-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3005
    volumes:
      - ./:/usr/src/unifinder
    working_dir: /usr/src/unifinder

    networks:
      - monorepo-network

    # for production 
    command: bash -c "npm install && npm run build && npm run start:prod:batch"
    

networks:
  monorepo-network:
    driver: bridge 